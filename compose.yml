name: ${COMPOSE_PROJECT_NAME:-mediadrop-modern}

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-mediadrop}
      MARIADB_USER: ${DB_USER:-mediadrop}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # Legacy-compatible MariaDB. This remains a Docker named volume on purpose.
      - mediadrop_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-MediaDrop}
      LOCALE: ${LOCALE:-en}
      ENVIRONMENT: production
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: mysql+pymysql://${DB_USER:-mediadrop}:${DB_PASSWORD}@db:3306/${DB_NAME:-mediadrop}?charset=utf8mb4
      MODERN_DATABASE_URL: ${MODERN_DATABASE_URL:-sqlite:////data/modern/mediadrop-modern.db}
      MEDIA_ROOT: /data/media
      IMAGE_ROOT: /data/images
      LEGACY_MEDIA_ROOT: /data/legacy-media
      LEGACY_IMAGE_ROOT: /data/legacy-images
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PUBLIC_UPLOADS: ${PUBLIC_UPLOADS:-false}
      UPLOADS_REQUIRE_REVIEW: ${UPLOADS_REQUIRE_REVIEW:-true}
      MEDIA_SERVE_MODE: ${MEDIA_SERVE_MODE:-app}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2047}
      MAX_THUMBNAIL_MB: ${MAX_THUMBNAIL_MB:-20}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/data/logs/audit.log}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    volumes:
      # Writable data created by MediaDrop Modern.
      - "${MODERN_DATA_ROOT:-/opt/mediadrop-modern-data}/media:/data/media"
      - "${MODERN_DATA_ROOT:-/opt/mediadrop-modern-data}/images:/data/images"
      - "${MODERN_DATA_ROOT:-/opt/mediadrop-modern-data}/modern:/data/modern"
      - "${MODERN_DATA_ROOT:-/opt/mediadrop-modern-data}/logs:/data/logs"

      # Existing legacy MediaDrop archive. Never write to these mounts.
      - "${LEGACY_DATA_ROOT:-/opt/mediadrop_data}/media:/data/legacy-media:ro"
      - "${LEGACY_DATA_ROOT:-/opt/mediadrop_data}/images:/data/legacy-images:ro"

volumes:
  mediadrop_db:
