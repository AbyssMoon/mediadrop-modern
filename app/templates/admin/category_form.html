{% extends "base.html" %}
{% block title %}{{ t('admin.edit_category') }} — {{ site.site_name }}{% endblock %}
{% block content %}
<section class="admin-page container-wide">
  {% include "admin/_nav.html" %}
  <div class="section-heading section-heading--compact">
    <div><span class="eyebrow">{{ t('admin.categories') }}</span><h2>{{ t('admin.edit_category') }}</h2></div>
    <a class="button button--secondary" href="/admin/categories">← {{ t('admin.categories') }}</a>
  </div>
  <form class="surface admin-editor compact-editor" method="post" action="/admin/categories/{{ category.id }}/edit">
    <input type="hidden" name="csrf" value="{{ csrf_token }}">
    <label>{{ t('admin.category_name') }}<input name="name" required maxlength="50" value="{{ category.name }}"></label>
    <label>{{ t('admin.slug') }}<input name="slug" required maxlength="50" value="{{ category.slug }}"><small>{{ t('admin.category_slug_help') }}</small></label>
    <label>{{ t('admin.parent_category') }}
      <select name="parent_id">
        <option value="">{{ t('admin.no_parent') }}</option>
        {% for row in category_rows %}
          {% if row.category.id != category.id %}<option value="{{ row.category.id }}" {% if category.parent_id == row.category.id %}selected{% endif %}>{{ '— ' * row.depth }}{{ row.category.name }}</option>{% endif %}
        {% endfor %}
      </select>
      <small>{{ t('admin.parent_category_help') }}</small>
    </label>
    <div class="form-actions"><button>{{ t('admin.save') }}</button></div>
  </form>
</section>
{% endblock %}
