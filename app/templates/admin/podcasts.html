{% extends "base.html" %}
{% block title %}{{ t('admin.podcasts') }} — {{ site.site_name }}{% endblock %}
{% block content %}<section class="admin-page container-wide">{% include "admin/_nav.html" %}<div class="section-heading section-heading--compact"><div><h2>{{ t('admin.podcasts') }}</h2></div></div><form class="surface editor-form compact-editor" method="post" action="/admin/podcasts/new"><input type="hidden" name="csrf" value="{{ csrf_token }}"><label>{{ t('admin.podcast_title') }}<input name="title" required maxlength="50"></label><label>{{ t('admin.description') }}<textarea name="description"></textarea></label><button>{{ t('admin.add_podcast') }}</button></form><div class="surface manage-card">{% for p in podcasts %}<div class="manage-row"><div><a href="/podcasts/{{ p.slug }}"><strong>{{ p.title }}</strong></a><span>/{{ p.slug }}</span></div><form method="post" action="/admin/podcasts/{{ p.id }}/delete"><input type="hidden" name="csrf" value="{{ csrf_token }}"><button class="button button--danger button--small">{{ t('admin.delete') }}</button></form></div>{% else %}<div class="empty-row">—</div>{% endfor %}</div></section>{% endblock %}
